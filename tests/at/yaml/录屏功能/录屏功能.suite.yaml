name: 录屏功能_suite
app: deepin-screen-recorder
description: ''
module: 录屏功能
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-screen-recorder -s
  wait: 3.0
suites:
- id: case_record_start_s1
  name: 启动录屏功能
  description: ''
  tags: []
  steps:
  - action: element_action
    selector:
      name: to_record_but
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: record_option_but
      role: push button
