name: 截图功能_suite
app: deepin-screen-recorder
description: ''
module: 截图功能
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-screen-recorder -s
  wait: 3.0
suites:
- id: case_shot_start_hotkey_s1
  name: 截图-快捷键启动
  description: ''
  tags: []
  steps:
  - action: keyboard_hot_key
    key: Ctrl+Alt+A
  assert_steps:
  - action: assert_element
    selector:
      name: rect_button
      role: push button
- id: case_shot_complete_btn_s1
  name: 完成截图-点击截图按钮
  description: ''
  tags: []
  steps:
  - action: element_action
    selector:
      name: rect_button
      role: push button
    do: click
  - action: element_action
    selector:
      name: save_local_button
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: save_local_button
      role: push button
- id: case_shot_clipboard_s1
  name: 截图后剪切板验证
  description: ''
  tags: []
  steps:
  - action: keyboard_hot_key
    key: Ctrl+Alt+A
  - action: element_action
    selector:
      name: SaveToClipboard
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: rect_button
      role: push button
  - action: assert_element
    selector:
      name: SaveToClipboard
      role: push button
teardown:
- action: session_stop
